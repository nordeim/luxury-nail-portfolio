# Aurelia Nail Artistry — hosted CI (R6-05).
#
# Closes the standing "no hosted CI" watch item (LOW since R1; R5 §7 ②):
# the full local gate chain runs on every push/PR to main. The e2e suite
# tests the SHIPPED artifact — `npm run verify` includes the single-file
# build, then Playwright serves it via `vite preview` (its own webServer,
# port 4173 — nothing to manage here).
#
# Environment notes:
#   - Node 22 satisfies both runtimes (SPA needs >= 20; db:* scripts need
#     >= 22.5 for node:sqlite — not exercised on CI, the SPA is zero-server).
#   - No DATABASE_URL is set: the .env-contract unit gate reads .env when
#     present, else falls back to the tracked .env.example (by design).
#   - `--with-deps` installs the OS libraries the headless shell needs on
#     the ubuntu runner; the cache pins the browser revision per Playwright
#     version, so a lockfile bump re-downloads automatically.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      - name: Verify (typecheck → lint → unit → build)
        run: npm run verify

      - name: E2E (both projects, vs the production preview)
        run: npm run e2e

      - name: Upload Playwright reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
