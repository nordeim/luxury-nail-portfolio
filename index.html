<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>HomeNest Kitchen</title>
    <!--
      Static head set (session 8 — SEO workstream). Shape mirrors the live
      reference's head (measured 2026-10-12): description, OG + Twitter set,
      media-CDN logo favicon. HeadManager rewrites title/description/
      canonical/og:url per route on mount; these values are the first-paint
      and no-JS fallbacks. The origin below is the documented VITE_SITE_URL
      default (http://localhost:4173) — override it in .env and re-run
      `node scripts/generate-sitemap.mjs` when deploying elsewhere.
    -->
    <meta
      name="description"
      content="Your professional destination for premium kitchen essentials, organized storage solutions, and gourmet cooking tools designed to elevate your culinary experience."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#fbfaf9" />
    <link rel="canonical" href="http://localhost:4173/" />
    <!-- Favicon: remote-CDN logo pin, per the ecommerce-store template's
         FAVICON-1 precedent (no shipped binary, pixel parity with the
         reference's own icon). -->
    <link
      rel="icon"
      type="image/png"
      href="https://media.base44.com/images/public/69d42a22d48136041e198f55/2d5ea29ee_logo.png/v1/fit/w_180,h_180/2d5ea29ee_logo.png"
    />
    <!-- PWA manifest (R18-01, superset — the reference ships no manifest):
         minimal installability surface; icons reuse the FAVICON-1 CDN logo
         at the two install-required sizes. Root-relative start_url/scope
         keep it deploy-origin agnostic. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- OpenGraph (reference head shape) -->
    <meta property="og:title" content="HomeNest Kitchen" />
    <meta
      property="og:description"
      content="Your professional destination for premium kitchen essentials, organized storage solutions, and gourmet cooking tools designed to elevate your culinary experience."
    />
    <meta
      property="og:image"
      content="https://media.base44.com/images/public/69d42a22d48136041e198f55/2d5ea29ee_logo.png/v1/fill/w_1200,h_630/2d5ea29ee_logo.png"
    />
    <meta property="og:url" content="http://localhost:4173/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="HomeNest Kitchen" />
    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HomeNest Kitchen" />
    <meta
      name="twitter:description"
      content="Your professional destination for premium kitchen essentials, organized storage solutions, and gourmet cooking tools designed to elevate your culinary experience."
    />
    <meta
      name="twitter:image"
      content="https://media.base44.com/images/public/69d42a22d48136041e198f55/2d5ea29ee_logo.png/v1/fill/w_1200,h_630/2d5ea29ee_logo.png"
    />
    <meta name="twitter:url" content="http://localhost:4173/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap"
      rel="stylesheet"
    />
    <!-- Structured data: one node per script (CSP-exempt static blocks;
         the reference ships none — SEO superset member, ecommerce-store
         template JSON-LD-1 shape). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "HomeNest Kitchen",
        "url": "http://localhost:4173",
        "logo": "https://media.base44.com/images/public/69d42a22d48136041e198f55/2d5ea29ee_logo.png/v1/fill/w_1200,h_630/2d5ea29ee_logo.png"
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "HomeNest Kitchen",
        "url": "http://localhost:4173"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
