<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Aurelia Nail Artistry</title>
    <!-- theme-color sits ABOVE the pre-paint script so the script can tint
         the browser chrome in the same synchronous pass (R4-03) — a static
         light value left the mobile URL bar cream while the page was dark. -->
    <meta name="theme-color" content="#f5f3ef" />
    <script>
      /* Pre-paint theme resolution (R2-01, remediation-plan-aurelia-r2.md).
         The token blocks in index.css are light under :root; without this
         synchronous script a dark user (stored dark choice, or dark OS with
         no choice yet) paints light first and flips after React mounts — a
         flash that reads as "theme switching doesn't work". Mirrors the
         store's readStoredMode contract: any stored value that is not
         "light" resolves through the OS preference. data-theme-applied is
         test-facing evidence that this script ran before hydration. */
      (function () {
        try {
          var stored = localStorage.getItem("aurelia.theme");
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          } else {
            document.documentElement.style.colorScheme = "light";
          }
          /* R4-03: the browser chrome follows the same resolution — the
             meta above is parsed by the time this runs. The hex literals
             mirror the pinned token grounds in src/lib/theme.ts. */
          var themeColor = document.querySelector('meta[name="theme-color"]');
          if (themeColor) themeColor.setAttribute("content", dark ? "#13110f" : "#f5f3ef");
          document.documentElement.setAttribute(
            "data-theme-applied",
            dark ? "dark" : "light"
          );
        } catch (e) {
          /* No storage / private mode: the :root light tokens stay — the
             SPA re-applies the resolved theme on mount (theme.ts). */
        }
      })();
    </script>
    <!--
      Static head set. Shape mirrors the live reference's head (measured
      2026-10-19): description, OG + Twitter set, per-route title map handled
      by HeadManager after first paint — these values are the first-paint and
      no-JS fallbacks. The origin below is the documented VITE_SITE_URL
      default (http://localhost:4173) — override it in .env and re-run
      `node scripts/generate-sitemap.mjs` when deploying elsewhere.
      Fonts: Cormorant Garamond (display) + Inter (body), matching the
      reference's measured families (docs/reference-investigation.md §4).
    -->
    <meta
      name="description"
      content="Aurelia Nail Artistry — bespoke luxury nail design in Los Angeles. Editorial, bridal, and avant-garde nail artistry by Aurelia Chen."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="http://localhost:4173/" />
    <!-- Favicon: inline SVG monogram "A" on the brand ink — independently
         created, no external binary, dark-mode safe. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%231a1a1a'/%3E%3Ctext x='32' y='44' font-family='Georgia,serif' font-size='36' fill='%23f5f3ef' text-anchor='middle'%3EA%3C/text%3E%3C/svg%3E"
    />
    <!-- PWA manifest (superset — the reference ships no manifest). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS home-screen icon (R3-05) — the manifest icons do not cover
         Safari's apple-touch-icon; generated from the same monogram. -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- OpenGraph (reference head shape; R3-02 adds the image dimensions
         and alt so social crawlers can size the card without fetching and
         decoding the JPEG). -->
    <meta property="og:title" content="Aurelia Nail Artistry" />
    <meta
      property="og:description"
      content="Aurelia Nail Artistry — bespoke luxury nail design in Los Angeles. Editorial, bridal, and avant-garde nail artistry by Aurelia Chen."
    />
    <meta property="og:image" content="http://localhost:4173/images/hero.jpg" />
    <meta property="og:image:width" content="1344" />
    <meta property="og:image:height" content="768" />
    <meta
      property="og:image:alt"
      content="Moody editorial photograph of a manicured hand with sculptural nail art"
    />
    <meta property="og:url" content="http://localhost:4173/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Aurelia Nail Artistry" />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Aurelia Nail Artistry" />
    <meta
      name="twitter:description"
      content="Aurelia Nail Artistry — bespoke luxury nail design in Los Angeles. Editorial, bridal, and avant-garde nail artistry by Aurelia Chen."
    />
    <meta name="twitter:image" content="http://localhost:4173/images/hero.jpg" />
    <meta
      name="twitter:image:alt"
      content="Moody editorial photograph of a manicured hand with sculptural nail art"
    />
    <meta name="twitter:url" content="http://localhost:4173/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "NailSalon",
        "name": "Aurelia Nail Artistry",
        "url": "http://localhost:4173",
        "image": "http://localhost:4173/images/hero.jpg",
        "telephone": "+1-310-555-0123",
        "email": "hello@aurelia-nails.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "8423 Melrose Place",
          "addressLocality": "Los Angeles",
          "addressRegion": "CA",
          "postalCode": "90069",
          "addressCountry": "US"
        },
        "openingHours": "Tu-Sa 10:00-18:00",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "10:00",
            "closes": "18:00"
          }
        ],
        "sameAs": ["https://www.instagram.com/aurelia.nails"]
      }

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Aurelia Nail Artistry",

      }
    </script>
  </head>
